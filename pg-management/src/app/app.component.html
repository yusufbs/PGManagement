<div class="app-layout">
  <mat-toolbar color="primary" class="main-toolbar">
    <button mat-icon-button (click)="sidenav.toggle()" aria-label="Toggle menu">
      <mat-icon>menu</mat-icon>
    </button>
    <div class="brand">
      <mat-icon class="brand-icon">apartment</mat-icon>
      <span class="brand-title">{{ title() }}</span>
    </div>
    <span class="spacer"></span>
    <button mat-button routerLink="/rooms/available" class="quick-link">
      <mat-icon>meeting_room</mat-icon> Empty Rooms
    </button>
    <button mat-button routerLink="/bills/pending-dues" class="quick-link dues-link">
      <mat-icon>warning</mat-icon> Pending Dues
    </button>
  </mat-toolbar>

  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav #sidenav mode="side" opened class="sidenav">
      <mat-nav-list>
        <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link" (click)="sidenav.mode === 'over' ? sidenav.close() : null">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Dashboard</span>
        </a>

        <a mat-list-item routerLink="/rooms" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }" (click)="sidenav.mode === 'over' ? sidenav.close() : null">
          <mat-icon matListItemIcon>hotel</mat-icon>
          <span matListItemTitle>All Rooms</span>
        </a>

        <a mat-list-item routerLink="/rooms/available" routerLinkActive="active-link" (click)="sidenav.mode === 'over' ? sidenav.close() : null">
          <mat-icon matListItemIcon>check_circle</mat-icon>
          <span matListItemTitle>Empty Rooms</span>
        </a>

        <a mat-list-item routerLink="/tenants" routerLinkActive="active-link" (click)="sidenav.mode === 'over' ? sidenav.close() : null">
          <mat-icon matListItemIcon>people</mat-icon>
          <span matListItemTitle>Tenants</span>
        </a>

        <a mat-list-item routerLink="/bills" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }" (click)="sidenav.mode === 'over' ? sidenav.close() : null">
          <mat-icon matListItemIcon>receipt_long</mat-icon>
          <span matListItemTitle>Bills & Receipts</span>
        </a>

        <a mat-list-item routerLink="/bills/pending-dues" routerLinkActive="active-link" (click)="sidenav.mode === 'over' ? sidenav.close() : null">
          <mat-icon matListItemIcon class="warn-icon">money_off</mat-icon>
          <span matListItemTitle>Pending Dues</span>
        </a>

        <a mat-list-item routerLink="/bills/generate" routerLinkActive="active-link" (click)="sidenav.mode === 'over' ? sidenav.close() : null">
          <mat-icon matListItemIcon>post_add</mat-icon>
          <span matListItemTitle>Generate Bill</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="main-content">
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
